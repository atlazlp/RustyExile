name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: RustyExile-linux-x86_64.zip
            binary: target/release/RustyExile
          - os: windows-latest
            asset: RustyExile-windows-x86_64.zip
            binary: target/release/RustyExile.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system packages
        if: runner.os == 'Linux'
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev zip; then
              exit 0
            fi
            echo "apt failed on attempt ${attempt}; the Ubuntu mirror could not be resolved"
            sleep 20
          done
          exit 1
      - name: build
        run: cargo build --release -p RustyExile
      - name: package linux
        if: runner.os == 'Linux'
        run: |
          stage="$(mktemp -d)"
          cp "${{ matrix.binary }}" "$stage/RustyExile"
          chmod 755 "$stage/RustyExile"
          cp -a assets "$stage/assets"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/${{ matrix.asset }}" RustyExile assets)
      - name: package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "rusty-stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "${{ matrix.binary }}" (Join-Path $stage "RustyExile.exe")
          Copy-Item -Recurse assets (Join-Path $stage "assets")
          Compress-Archive -Path "$stage\RustyExile.exe", "$stage\assets" -DestinationPath "${{ matrix.asset }}"
      - name: windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.4.exe"
            Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $setup
            $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
            if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Inno Setup download was not an executable."
            }
            Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          }
          ./packaging/windows/build-installer.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: RustyExile-windows-x86_64-setup.exe
          path: dist/RustyExile-windows-x86_64-setup.exe

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag="v${version}"
          shopt -s nullglob
          files=(dist/*.zip dist/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release archives were built"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "RustyExile ${version}" --notes "Release ${version}."
          fi
